name: Deploy Auth Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Auth Server
        run: |
          cd /home/ubuntu/auth-server
          git pull origin main
          docker compose --env-file .env up -d
          echo "Deployment complete"