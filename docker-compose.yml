version: "3.8"

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - keycloak-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start --spi-theme-static-max-age=31536000 --spi-theme-cache-themes=true --spi-theme-cache-templates=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth.learn-map.in
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_SPI_EMAIL_SENDER: "smtp"
      KC_SPI_EMAIL_SMTP_HOST: ${KC_SMTP_SERVER}
      KC_SPI_EMAIL_SMTP_PORT: ${KC_SMTP_PORT}
      KC_SPI_EMAIL_SMTP_USERNAME: ${KC_SMTP_USERNAME}
      KC_SPI_EMAIL_SMTP_PASSWORD: ${KC_SMTP_PASSWORD}
      KC_SPI_EMAIL_FROM: ${KC_SMTP_FROM}
      KC_SPI_EMAIL_SSL: ${KC_SMTP_SSL}
      JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=40 -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication"
    volumes:
      - ./data:/opt/keycloak/data
    networks:
      - keycloak-internal
      - keycloak-external
    depends_on:
      keycloak-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  caddy:
    image: caddy:2-alpine
    container_name: keycloak-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - keycloak-external
    depends_on:
      - keycloak

networks:
  keycloak-internal:
    driver: bridge
    internal: true
  keycloak-external:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  keycloak_pgdata: